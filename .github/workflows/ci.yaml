name: CI/CD Pipeline

on:
  push:
    branches: [main, master, update]
  pull_request:
    branches: [main, master, update]

jobs:
  security-and-tests:
    name: Security Checks, Code Style & Unit/Functional Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: notifications_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, opcache, redis
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check dependency vulnerabilities (SCA)
        run: composer audit --locked

      - name: Code style check (php-cs-fixer)
        run: composer fix-cs

      - name: Run Database Migrations
        env:
          DATABASE_URL: pgsql://app:app@127.0.0.1:5432/notifications_test?serverVersion=13&charset=utf8
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit Tests
        env:
          APP_ENV: test
          DATABASE_URL: pgsql://app:app@127.0.0.1:5432/notifications_test?serverVersion=13&charset=utf8
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: vendor/bin/phpunit
